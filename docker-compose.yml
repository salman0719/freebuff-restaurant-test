services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: restaurant_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d restaurant_app"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP catch-all with inbox UI (http://localhost:8025).
  # Starts with plain `up -d` so magic-link sign-in works in local dev:
  # set EMAIL_SERVER/EMAIL_FROM in `.env.local` (see `.env.example`).
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI + API
    volumes:
      - mailpit:/data

  # Browser database viewer (http://localhost:7070).
  # Opt-in via the `tools` profile so plain `docker compose up -d` is unchanged:
  #   docker compose --profile tools up -d adminer
  # Login: system PostgreSQL, server `db`, user `app`, password `secret`.
  adminer:
    image: adminer:6.1.1
    restart: unless-stopped
    profiles:
      - tools
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "7070:8080"

volumes:
  pgdata:
  mailpit:
