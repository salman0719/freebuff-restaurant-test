name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Matches `docker-compose.yml` credentials so the same DATABASE_URL
      # works locally and in CI.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: restaurant_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d restaurant_app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Real SMTP catch-all for the magic-link E2E (SMTP :1025, API :8025).
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://app:secret@localhost:5432/restaurant_app
      TEST_DATABASE_URL: postgresql://app:secret@localhost:5432/restaurant_app
      # Ephemeral CI-only values (never production secrets): the E2E signs
      # in through Mailpit above, so auth needs a complete test config.
      AUTH_SECRET: ci-only-ephemeral-secret-not-used-in-production-0000
      AUTH_URL: http://localhost:4030
      AUTH_TRUST_HOST: "true"
      EMAIL_SERVER: smtp://localhost:1025
      EMAIL_FROM: "CI Test <ci-e2e@platform.example>"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Migrate first: the service Postgres starts empty, and both the
      # live unit suites and the E2E need tables to exist.
      - run: npm run db:migrate
      - run: npm run test:run
      - run: npm run build
      # Release gate: the only check that proves a request is actually
      # *bounced* by the edge gate. A build that lists `ƒ Proxy (Middleware)`
      # proves nothing on its own — emptying the matcher leaves that listing
      # in place while four private routes answer 200. Sits before the browser
      # install so the cheapest, highest-signal check fails first.
      # Port 4031, not the E2E's 4030: in CI Playwright sets reuseExistingServer
      # to false and would refuse to start beside a server already there. The
      # server outlives this step by design (the runner is disposable, and
      # nothing else in the job binds 4031); its log is kept for failures.
      - name: Route smoke check (edge gate)
        run: |
          nohup npx next start -p 4031 > /tmp/smoke-server.log 2>&1 < /dev/null &
          npm run smoke -- http://localhost:4031 --wait 60000
      - name: Smoke check server log
        if: failure()
        run: cat /tmp/smoke-server.log
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
